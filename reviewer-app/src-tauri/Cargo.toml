[package]
name = "reviewer-app"
version = "0.1.0"
description = "A clinical review interface for the Drugref curated overlay"
authors = ["Drugref contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reviewer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reviewer-domain = { path = "../../reviewer-domain" }
argon2 = "0.5"
iota_stronghold = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
ed25519-dalek = "2"

# Argon2's deliberately expensive inner loop is unusably slow when left
# completely unoptimised during local Tauri development and native tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.test.package.argon2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3
