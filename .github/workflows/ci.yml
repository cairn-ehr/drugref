name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Issue 66. Before this job, ruff ran nowhere in CI and was not even a project
  # dependency, so `uv run ruff` resolved to whatever happened to be on the developer's
  # PATH -- and the ~88-column convention src/ is visibly written to was enforced by
  # nothing at all. A lint rule set that no automated check runs is a style note, not a
  # gate; this is what makes it a gate. The configuration (line-length, the rule
  # selection, and the temporary tests/ carve-out) lives in pyproject.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # --locked, not a bare sync. `uv sync` LOCKS THEN SYNCS: if pyproject.toml and
      # uv.lock disagree it quietly re-resolves and carries on, so the ruff pin
      # pyproject argues for ("the version lives in the lockfile") was unenforced in
      # the one place that claim is about. --locked fails the build on a stale lock
      # instead.
      - name: Sync dependencies
        run: uv sync --locked

      # A bare `.` is deliberate. What makes it safe is that ruff honours .gitignore by
      # default, and both bulky trees (downloads/, docs-site/site/) are ignored --
      # measured at 0.18 s over a 614 MB downloads/. pyproject's extend-exclude is
      # belt-and-braces for the day one of them stops being ignored; it is NOT what
      # makes this fast, and the comment there says so.
      - name: Lint
        run: uv run ruff check .

  pytest:
    runs-on: ubuntu-latest

    # The suite is majority DB-gated (schema, triggers, the append-only floor, both
    # ingest orchestrators). Without a real database those tests SKIP and pytest
    # still exits 0, so a green run would say nothing about the layer this project
    # deliberately puts its integrity in. The service container is what makes the
    # green meaningful; conftest fails rather than skips when CI is set, so a
    # mis-wired DSN here cannot quietly go back to reporting success.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drugref_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DRUGREF_TEST_DSN: "host=localhost port=5432 dbname=drugref_test user=postgres password=postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # --locked, not a bare sync. `uv sync` LOCKS THEN SYNCS: if pyproject.toml and
      # uv.lock disagree it quietly re-resolves and carries on, so the ruff pin
      # pyproject argues for ("the version lives in the lockfile") was unenforced in
      # the one place that claim is about. --locked fails the build on a stale lock
      # instead.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the full suite
        # -m "not livepage": one test compares the committed fixture against the
        # real page under downloads/, which is gitignored and so does not exist
        # here. DESELECTED rather than skipped, deliberately -- the step below
        # fails on any skip, and that gate keeps its full force only if genuine
        # exclusions are named here in the open instead of being discovered at
        # runtime. See pyproject's [tool.pytest.ini_options] markers on why the
        # set is exactly one test long and must stay that way.
        run: uv run pytest -q -m "not livepage"

      - name: Confirm nothing was skipped
        # A belt-and-braces guard on the guard: if the DB-gated tests ever start
        # skipping again (a renamed env var, a changed fixture), the suite would go
        # back to passing vacuously. Fail loudly on any skip instead.
        #
        # THIS STEP COULD NOT FAIL ON A FAILING PYTEST, which is the failure mode it
        # exists to prevent, one level up. It was written as `pytest ... | tee out.txt
        # && ! grep -q skipped out.txt`; GitHub runs steps under `bash -e` with NO
        # pipefail, so the pipeline's status is tee's -- always 0 -- and only the grep
        # decided the step. A run with 5 failures and 0 skips passed. That mattered
        # because this is a SECOND pytest run against the same service container, which
        # the first run has already written to, so it is exactly where a state-dependent
        # failure shows up first. Redirect instead of piping, so pytest's own exit
        # status is the step's.
        #
        # The grep is anchored on the count line too: `-rs` prints its short summary as
        # "SKIPPED", which a case-sensitive `grep -q skipped` never matched, so only
        # pytest's own "N skipped" tally was ever doing the work. Say so explicitly.
        run: |
          uv run pytest -q --strict-markers -p no:randomly -rs -m "not livepage" > out.txt 2>&1 || { cat out.txt; exit 1; }
          cat out.txt
          ! grep -qE '[0-9]+ skipped' out.txt
