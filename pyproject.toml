[project]
name = "drugref"
version = "0.0.1"
description = "drugref.org — an open drug-information service (global tier)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
# RULE 6 (CLAUDE.md): every dependency must be AGPL-3.0-compatible, CHECKED BEFORE
# ADDING. `cryptography` (PyCA) declares the license expression
# "Apache-2.0 OR BSD-3-Clause" (PyPI metadata, verified against 50.0.0, which ships
# both LICENSE.APACHE and LICENSE.BSD). Dual licensing lets drugref ELECT
# BSD-3-Clause, which is AGPL-3.0-compatible outright -- so the clearance does not
# even rest on Apache-2.0's one-way compatibility with GPLv3/AGPLv3.
#
# It is unavoidable rather than convenient: there is no Ed25519 in the Python standard
# library, and a pure-Python implementation of a signature scheme is exactly the thing
# not to hand-roll. NOTICE is unchanged -- it attributes bundled reference-data
# SOURCES, and this redistributes no data.
dependencies = ["psycopg[binary]>=3.2", "cryptography>=42"]

[project.scripts]
drugref = "drugref.cli:main"

[dependency-groups]
# ruff is pinned into the dev group deliberately (issue 66). Before this it was not a
# project dependency at all, so `uv run ruff` fell through to whatever ruff happened to
# be on the developer's PATH -- a pyenv shim at 0.11.0 on the machine this was found on,
# and nothing whatsoever in CI. A lint rule set is only a gate if every checkout and
# every CI run resolves the same linter, so the version lives in the lockfile.
dev = ["pytest>=8", "ruff>=0.11,<0.13"]
docs = ["mkdocs-material>=9.5,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drugref"]

# The migration SQL ships INSIDE the wheel. It is not optional extra data: `drugref
# migrate` is the first command an operator runs, and without these files it applied
# nothing and reported success (db.MissingMigrationsError now refuses that, but the
# installed CLI still has to actually work). db/ lives at the repository root because
# it is also read by psql and by hand, so it is force-included rather than moved.
#
# The destination is drugref/migrations/, NOT drugref/db/, which would shadow the
# drugref.db module's name on the import path.
#
# An EDITABLE install gets this copy too (hatchling applies force-include in both
# modes) and it is inert there, deliberately: db.migration_dir() looks beside the
# db.py it is IMPORTED FROM, which in a checkout is src/drugref/ -- a directory the
# copy never lands in -- so the dev path always reads db/ at the repository root and
# can never be served a snapshot that went stale between syncs.
[tool.hatch.build.targets.wheel.force-include]
"db" = "drugref/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---- lint (issue 66) --------------------------------------------------------
#
# There was no [tool.ruff] section at all before this, which meant ruff ran with its
# DEFAULT rule set -- and E501 (line too long) is not in it. So the ~88-column
# convention every file under src/ is visibly written to was enforced by nothing, and
# 52 lines had already drifted past it without a single warning.
#
# 88 is chosen because it is what src/ already IS, not as an aspiration: measured
# across src/, there were 52 lines over 88, 0 over 100, 0 over 120. tests/ is a
# different story and is exempted below.
#
# THE [tool.ruff] HEADER IS LOAD-BEARING and was missing in the first draft of this
# section, which put `line-length` inside [tool.pytest.ini_options] instead. Nothing
# failed: 88 is also ruff's own default, so the lint run looked correct, and the only
# symptom was pytest warning "Unknown config option: line-length". A settings block
# under the wrong header is not an error in either tool -- each simply ignores what it
# does not recognise -- so the value that appears to be configured here has to be
# checked against `ruff check --show-settings`, not assumed from the file. The positive
# control is better still, because it does not depend on reading the setting right: a
# deliberately over-88 line in src/ must FAIL, and one in tests/ must not.
[tool.ruff]
line-length = 88

# BELT-AND-BRACES, NOT THE REASON `ruff check .` IS FAST -- and the difference matters,
# because an earlier version of this comment claimed the exclusion was what stopped a
# hang on downloads/ (a 321 MB gzip that expands to ~2.05 GB, one artefact and not two).
# Measured with the ruff pinned above: with extend-exclude emptied, `ruff check .` still
# completes in 0.18 s over a 614 MB downloads/. What actually keeps it out is that ruff
# honours .gitignore by default and both trees are ignored -- and that ruff only ever
# opens .py/.pyi files, so a data blob costs nothing regardless. This setting is here
# for the day one of those paths stops being gitignored; do not read it as a fix for a
# hang it does not cause. `docs-site/site` is MkDocs build output, and it is the one
# that earns its keep: bypassing gitignore surfaces 662 E501s from it alone.
extend-exclude = ["downloads", "docs-site/site"]

[tool.ruff.lint]
# Ruff's DEFAULT selection is ["E4", "E7", "E9", "F"] -- a subset of E, which is why
# E501 was absent. Selecting all of E is therefore not a no-op beyond E501, and W is
# not only trailing whitespace (W291/W293): it also brings W605, invalid escape
# sequence, which is what catches the day a docstring full of regex-looking text writes
# `\d+` instead of `\\d+`.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# tests/ is NOT written to 88 and never has been: 334 lines exceed it, against 0 now in
# src/. That is not drift, it is a different (unstated) convention -- the measured
# ceiling across tests/ is 119 characters, and the long lines are overwhelmingly the
# explanatory docstrings this project requires, plus inline SQL that reads worse when
# wrapped.
#
# THAT COUNT IS A MEASUREMENT WITH A DATE, not a constant: it was 324 when the carve-out
# was written and 334 by the end of the same branch, because new test files land under
# the exemption. Re-measure it rather than trusting it --
#   uv run ruff check tests --config 'lint.select=["E501"]' \
#                           --config 'lint.per-file-ignores={}' --statistics
# -- and treat a drifted figure here as expected, not as a finding.
#
# Reflowing 334 lines in one pass would bury this change's actual content in mechanical
# noise and make `git log -p` useless on the suite, which is the same trade #63 already
# rejected for PROJECT-NOTES and ROADMAP. So tests/ is exempted from E501 EXPLICITLY
# and temporarily, with the decision recorded rather than left implicit, and the
# follow-up filed as issue 79.
#
# The exemption is E501 ONLY -- F, W and the rest of E still apply to tests/, verified
# with a probe file that duly failed on F401 and E402 while its 115-character line
# passed. This exemption is a debt, not a policy. Delete this block when 79 is closed.
"tests/**" = ["E501"]
