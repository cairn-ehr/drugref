[project]
name = "drugref"
version = "0.0.1"
description = "drugref.org — an open drug-information service (global tier)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
drugref = "drugref.cli:main"

[dependency-groups]
# ruff is pinned into the dev group deliberately (issue 66). Before this it was not a
# project dependency at all, so `uv run ruff` fell through to whatever ruff happened to
# be on the developer's PATH -- a pyenv shim at 0.11.0 on the machine this was found on,
# and nothing whatsoever in CI. A lint rule set is only a gate if every checkout and
# every CI run resolves the same linter, so the version lives in the lockfile.
dev = ["pytest>=8", "ruff>=0.11,<0.13"]
docs = ["mkdocs-material>=9.5,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drugref"]

# The migration SQL ships INSIDE the wheel. It is not optional extra data: `drugref
# migrate` is the first command an operator runs, and without these files it applied
# nothing and reported success (db.MissingMigrationsError now refuses that, but the
# installed CLI still has to actually work). db/ lives at the repository root because
# it is also read by psql and by hand, so it is force-included rather than moved.
#
# The destination is drugref/migrations/, NOT drugref/db/, which would shadow the
# drugref.db module's name on the import path.
#
# An EDITABLE install gets this copy too (hatchling applies force-include in both
# modes) and it is inert there, deliberately: db.migration_dir() looks beside the
# db.py it is IMPORTED FROM, which in a checkout is src/drugref/ -- a directory the
# copy never lands in -- so the dev path always reads db/ at the repository root and
# can never be served a snapshot that went stale between syncs.
[tool.hatch.build.targets.wheel.force-include]
"db" = "drugref/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---- lint (issue 66) --------------------------------------------------------
#
# There was no [tool.ruff] section at all before this, which meant ruff ran with its
# DEFAULT rule set -- and E501 (line too long) is not in it. So the ~88-column
# convention every file under src/ is visibly written to was enforced by nothing, and
# 52 lines had already drifted past it without a single warning.
#
# 88 is chosen because it is what src/ already IS, not as an aspiration: measured
# across src/, there were 52 lines over 88, 0 over 100, 0 over 120. tests/ is a
# different story and is exempted below.
#
# THE [tool.ruff] HEADER IS LOad-BEARING and was missing in the first draft of this
# section, which put `line-length` inside [tool.pytest.ini_options] instead. Nothing
# failed: 88 is also ruff's own default, so the lint run looked correct, and the only
# symptom was pytest warning "Unknown config option: line-length". A settings block
# under the wrong header is not an error in either tool -- each simply ignores what it
# does not recognise -- so the value that appears to be configured here has to be
# checked against `ruff check --show-settings`, not assumed from the file.
[tool.ruff]
line-length = 88

# `ruff check .` used to walk downloads/ and hang -- it holds a 2.05 GB GSRS dump and a
# 321 MB gzip -- so every instruction in this repo had to say `ruff check src tests`
# instead, and a bare `ruff check .` was a trap laid for the next contributor. Excluding
# the directory here fixes that at the source: the plain command is now safe, and the
# instructions no longer have to carry a workaround.
extend-exclude = ["downloads", "docs-site/site"]

[tool.ruff.lint]
# E and F are ruff's default selection; E501 is the one this adds, and W catches
# trailing-whitespace drift that is otherwise invisible in review.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# tests/ is NOT written to 88 and never has been: 324 lines exceed it, against 52 in
# src/. That is not drift, it is a different (unstated) convention -- the measured
# ceiling across tests/ is 119 characters, and the long lines are overwhelmingly the
# explanatory docstrings this project requires, plus inline SQL that reads worse when
# wrapped.
#
# Reflowing 324 lines in one pass would bury this change's actual content in mechanical
# noise and make `git log -p` useless on the suite, which is the same trade #63 already
# rejected for PROJECT-NOTES and ROADMAP. So tests/ is exempted from E501 EXPLICITLY
# and temporarily, with the decision recorded rather than left implicit, and the
# follow-up filed as issue 79.
#
# This exemption is a debt, not a policy. Delete this block when 79 is closed.
"tests/**" = ["E501"]
